apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-config
data:
  DOTNET_ENVIRONMENT: Development
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  Database__ApplyMigrations: "true"
  ConnectionStrings__AuditDb: Host=postgres;Port=5432;Database=audit_db;Username=postgres;Password=postgres
  Kafka__BootstrapServers: kafka:29092
  Kafka__ConsumerGroup: audit-worker
  Kafka__Topics__0: order-created
  Kafka__Topics__1: payment-approved
  Kafka__Topics__2: payment-rejected
