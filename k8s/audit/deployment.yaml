apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-worker
  labels:
    app: audit-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-worker
  template:
    metadata:
      labels:
        app: audit-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U postgres -d postgres; do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done
        - name: wait-for-kafka
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 5
              done
      containers:
        - name: audit-worker
          image: microservices-lab-audit-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: audit-config
