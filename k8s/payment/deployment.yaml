apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
                echo "Waiting for Kafka..."
                sleep 5
              done
      containers:
        - name: payment-service
          image: microservices-lab-payment-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: payment-config
