<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Ir para conteudo</a>
<div class="app-shell">
  <aside class="sidebar" aria-label="Navegacao principal">
    <div class="sidebar-header">
    <a class="brand" routerLink="/dashboard" aria-label="MicroservicesLab">
      <span class="brand-mark">ML</span>
      <span>
        <strong>MicroservicesLab</strong>
        <small>Painel de laboratorio</small>
      </span>
    </a>
      <button #menuButton class="menu-toggle" type="button" (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()" aria-controls="main-navigation"
        [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
        [title]="menuOpen() ? 'Fechar menu' : 'Abrir menu'">
        <span class="menu-icon" aria-hidden="true" [class.open]="menuOpen()"><span></span><span></span><span></span></span>
      </button>
    </div>

    <nav id="main-navigation" class="nav-list" [class.is-open]="menuOpen()" aria-label="Paginas do laboratorio">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
          {{ item.label }}
        </a>
      }
    </nav>
    <details class="appearance">
      <summary>Aparencia</summary>
      <fieldset class="theme-modes">
        <legend>Tema</legend>
        @for (mode of theme.modes; track mode.value) {
          <label>
            <input type="radio" name="theme-mode" [value]="mode.value"
              [checked]="theme.preferences().mode === mode.value" (change)="theme.setMode(mode.value)">
            <span>{{ mode.label }}</span>
          </label>
        }
      </fieldset>
      <fieldset class="accent-options">
        <legend>Cor de destaque</legend>
        <div class="swatches">
          @for (accent of theme.accents; track accent.value) {
            <button type="button" class="swatch" [style.--swatch]="accent.value"
              [attr.aria-label]="accent.label" [title]="accent.label"
              [attr.aria-pressed]="theme.preferences().accent === accent.value"
              (click)="theme.setAccent(accent.value)"><span aria-hidden="true"></span></button>
          }
        </div>
        <label class="custom-color">Cor personalizada
          <input type="color" aria-label="Selecionar cor personalizada" [value]="theme.preferences().accent"
            (input)="theme.setAccent($any($event.target).value)">
        </label>
        <label class="hex-color">Hexadecimal
          <input type="text" aria-label="Cor hexadecimal" maxlength="7" pattern="#[0-9a-fA-F]{6}"
            [value]="theme.preferences().accent" (change)="theme.setAccent($any($event.target).value)"
            spellcheck="false" autocapitalize="off">
        </label>
      </fieldset>
    </details>
  </aside>

  <main #mainContent id="main-content" class="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
