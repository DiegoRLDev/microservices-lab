<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Ir para conteudo</a>
<div class="app-shell">
  <aside class="sidebar" aria-label="Navegacao principal">
    <div class="sidebar-header">
    <a class="brand" routerLink="/dashboard" aria-label="MicroservicesLab">
      <span class="brand-mark">ML</span>
      <span>
        <strong>MicroservicesLab</strong>
        <small>Painel de laboratorio</small>
      </span>
    </a>
      <button #menuButton class="menu-toggle" type="button" (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()" aria-controls="main-navigation"
        [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
        [title]="menuOpen() ? 'Fechar menu' : 'Abrir menu'">
        <span class="menu-icon" aria-hidden="true" [class.open]="menuOpen()"><span></span><span></span><span></span></span>
      </button>
    </div>

    <nav id="main-navigation" class="nav-list" [class.is-open]="menuOpen()" aria-label="Paginas do laboratorio">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <main #mainContent id="main-content" class="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
