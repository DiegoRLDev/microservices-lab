server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/order/ {
        proxy_pass http://order-service:8080/;
    }

    location /api/inventory/ {
        proxy_pass http://inventory-service:8080/;
    }

    location /api/pricefeed/ {
        proxy_pass http://pricefeed-service:8080/;
        proxy_buffering off;
    }

    location /api/pricing/ {
        proxy_pass http://pricing-service:8080/;
    }

    location /api/audit/ {
        proxy_pass http://audit-worker:8080/;
    }
}
