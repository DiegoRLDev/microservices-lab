syntax = "proto3";

option csharp_namespace = "MicroservicesLab.Protos.Inventory";

package inventory;

service Inventory {
  rpc CheckAvailability (CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
}

message CheckAvailabilityRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckAvailabilityResponse {
  string product_id = 1;
  bool is_available = 2;
  int32 requested_quantity = 3;
  int32 available_quantity = 4;
  string unit_price = 5;
}

message ReserveStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveStockResponse {
  string product_id = 1;
  int32 reserved_quantity = 2;
  int32 remaining_quantity = 3;
  string unit_price = 4;
}

