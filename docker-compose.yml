name: microservices-lab

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order-created --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-approved --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment-rejected --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic price-updated --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  inventory-service:
    build:
      context: .
      dockerfile: src/services/Inventory.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__InventoryDb: Host=postgres;Port=5432;Database=inventory_db;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
    ports:
      - "5276:8080"
      - "7242:8081"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

  order-service:
    build:
      context: .
      dockerfile: src/services/Order.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__OrdersDb: Host=postgres;Port=5432;Database=order_db;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      InventoryGrpc__Address: http://inventory-service:8081
      Kafka__BootstrapServers: kafka:29092
      Kafka__OrderCreatedTopic: order-created
      Kafka__PaymentApprovedTopic: payment-approved
      Kafka__PaymentRejectedTopic: payment-rejected
      Kafka__PaymentEventsConsumerGroup: order-service-payment-events
      Resilience__Inventory__TimeoutSeconds: "2"
      Resilience__Inventory__RetryAttempts: "2"
      Resilience__Inventory__RetryDelayMilliseconds: "200"
      Resilience__Inventory__CircuitBreakerFailureThreshold: "3"
      Resilience__Inventory__CircuitBreakerOpenSeconds: "10"
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Http__Protocols: Http1
    ports:
      - "5074:8080"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

  payment-service:
    build:
      context: .
      dockerfile: src/services/Payment.Service/Dockerfile
    environment:
      APP_ENV: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      KAFKA_BROKERS: kafka:29092
      KAFKA_ORDER_CREATED_TOPIC: order-created
      KAFKA_PAYMENT_APPROVED_TOPIC: payment-approved
      KAFKA_PAYMENT_REJECTED_TOPIC: payment-rejected
      KAFKA_GROUP_ID: payment-service
      PAYMENT_MAX_AUTO_APPROVAL_AMOUNT: "10000"
    depends_on:
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy

  pricefeed-service:
    build:
      context: .
      dockerfile: src/services/PriceFeed.Service/Dockerfile
    environment:
      PRICE_PROVIDER: mock
      PRICE_UPDATE_INTERVAL: 500ms
      PRICE_HTTP_ADDR: :8080
      PRICE_GRPC_ADDR: :8081
      PRICE_KAFKA_ENABLED: "true"
      PRICE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRICE_KAFKA_TOPIC: price-updated
    ports:
      - "5080:8080"
      - "19090:8081"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  pricing-service:
    build:
      context: .
      dockerfile: src/services/Pricing.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: price-updated
      Kafka__ConsumerGroup: pricing-service
      GrpcLab__Enabled: "false"
    ports:
      - "5090:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      pricefeed-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: src/frontend/MicroservicesLab.App/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      pricefeed-service:
        condition: service_started
      pricing-service:
        condition: service_healthy

  audit-worker:
    build:
      context: .
      dockerfile: src/workers/Audit.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__AuditDb: Host=postgres;Port=5432;Database=audit_db;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: audit-worker
      Kafka__Topics__0: order-created
      Kafka__Topics__1: payment-approved
      Kafka__Topics__2: payment-rejected
    ports:
      - "5288:8080"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data:
